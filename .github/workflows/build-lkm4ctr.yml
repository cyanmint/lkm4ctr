# Build the merged lkm4ctr out-of-tree module across a KMI matrix, then
# boot-test every KMI under QEMU against its prebuilt stock/patched kernels.
#
# lkm4ctr is a single combined lkm4ctr.ko built from sources under
# vendor/ (see README.md). This workflow
# builds that module, for every KMI in the matrix, inside SukiSU-Ultra's
# prebuilt "DDK" (Driver Development Kit) container image
# (ghcr.io/ylarod/ddk-min:<kmi>-<release>, see
# https://github.com/SukiSU-Ultra/SukiSU-Ultra/blob/main/.github/workflows/ddk-lkm.yml
# and .../build-lkm.yml for the KMI list). Each image ships a genuine
# vmlinux + Module.symvers + matching clang toolchain for that KMI (arm64
# only -- the real GKI device target), instead of a bare
# `git clone kernel/common` + `gki_defconfig` + `modules_prepare` tree, which
# only has stub/empty symbol CRC data and previously caused several
# hard-to-diagnose build failures:
#   - android12-5.10: arch/arm64/kernel/asm-offsets.c (via kvm_host.h ->
#     kgdb.h) failed to compile with every clang version available on a
#     plain Ubuntu runner ("value out of range for constraint 'I'"), because
#     no matching prebuilt toolchain was used.
#   - android15-6.6 / android16-6.12: modpost hard-errored on unresolved
#     core kernel symbols (no real Module.symvers), and android16-6.12's
#     gendwarfksyms needed libdw-dev, which wasn't installed.
# Building against the DDK's real vmlinux/Module.symvers/toolchain avoids
# all of the above.
#
# Module built (per KMI):
#   lkm4ctr                -- merged module containing the shared
#                                shadow_hijack hook engine plus
#                                vendor_kernel.
# The resulting .ko for a given KMI is uploaded on its own
# (lkm4ctr-modules-<kmi>-arm64); it no longer bundles the userspace
# checker binary (see below).
#
# lkm4ctr_checker is a plain userspace diagnostic *binary*, not a kernel
# module: it performs real syscalls to observe whether isolation actually
# works, rather than reporting compile-time Kconfig facts, so it is not tied
# to any particular KMI/kernel build at all -- it is cross-compiled once for
# arm64 using a standard aarch64 gcc cross toolchain (no DDK image, no kernel
# headers) and uploaded as its own artifact (lkm4ctr_checker-arm64). The
# "build" (.ko) and "build-checker" jobs are fully independent of each other
# (neither `needs:` the other) since they share no build inputs or outputs;
# only the "test" job below (which needs both) recombines them.
#
# Boot test (QEMU)
# -----------------
# testsuite.zip bundles a ready-to-use image1.ext4 directly (a full Android
# system-as-root userland with toybox, a real bionic libc, static
# docker/dockerd/containerd/runc under /system/bin, and the exported alpine
# tarball already baked in at its root) plus a prebuilt static arm64
# /busybox binary, so this workflow no longer builds either at all -- both
# are downloaded and used completely verbatim, for every KMI.
#
# The actual per-KMI *kernels* booted under QEMU come from a second archive,
# testsuitekernels.zip, which bundles a "stock" (unpatched Android GKI) and,
# where available, a "patched" (SukiSU/SUSFS + ctr_patches) prebuilt kernel
# Image for each KMI, named `Image.<short-kmi>.stock` /
# `Image.<short-kmi>.patched` (e.g. `Image.a14-6.1.stock`; the "android"
# prefix of the KMI name is shortened to "a").
#
# The "test" job runs as its own matrix, one job per KMI in
# needs.prepare.outputs.test_matrix (the KMI build matrix plus
# $TEST_ONLY_KMIS -- see below). For a KMI actually built above, it
# downloads that KMI's lkm4ctr.ko plus the (KMI-independent) checker
# binary, fetches testsuite.zip and testsuitekernels.zip, and builds a
# single injected (busybox) ramdisk before booting every kernel Image
# available for that KMI in sequence:
#   - the injected ramdisk's /init is qemu_test.sh (a single "#!/busybox sh"
#     script that also doubles as the host-side QEMU launcher used below --
#     see its own header comment), dispatching on PID/argv[0]. As stage 1
#     (PID 1, argv[0] == "init"), it populates /dev via mdev (the test
#     kernels have no devtmpfs support), mounts image1.ext4 (/dev/nvme0n1,
#     the prebuilt testsuite root filesystem -- the test kernels have no
#     virtio support either, hence NVMe) at /newroot, copies
#     /lkm4ctr_checker (always) and /lkm4ctr.ko (only if this KMI was
#     actually built) and /busybox onto it, writes its own script onto the
#     new root as /second_init, then busybox switch_root's into /newroot
#     and execs /second_init -- the standard, kernel-supported way to hand
#     off from a cpio-based initramfs to a real block-device root. Since
#     /second_init's argv[0] is no longer "init", the very same script now
#     runs its stage-2 body instead of stage-1.
# The stage-2 body (running as PID 1 of the real root, image1.ext4) then:
# populates /dev again (switch_root does not preserve the initramfs's
# un-mounted /dev contents, so mdev must repopulate it), runs
# lkm4ctr_checker, insmods lkm4ctr.ko (if present -- a KMI with no build,
# see $TEST_ONLY_KMIS below, simply skips this and continues as a pure
# boot/dockerd sanity check), runs lkm4ctr_checker again, starts a real
# dockerd in the background, `docker run --privileged --rm --network host
# -it`s the alpine/ubuntu images already sitting at the root of
# image1.ext4, and finally returns to a shell -- i.e. an actual dockerd
# running under the lkm4ctr-patched kernel, not just a checker binary
# observing raw syscalls.
#
# Within one KMI's job, every kernel Image available for that KMI (stock,
# and patched if bundled) is booted sequentially, so QEMU is installed and
# the (sizeable) prebuilt image1.ext4 is downloaded only once per KMI
# instead of once per kernel:
#   - "stock": a stock, unpatched Android GKI kernel (no SukiSU/SUSFS/
#     lkm4ctr patches at all), a baseline sanity check of the QEMU boot
#     environment itself.
#   - "patched": SukiSU/SUSFS-patched *with* ctr_patches applied -- the
#     actual configuration lkm4ctr.ko is built and meant to be insmod'd
#     against.
# $TEST_ONLY_KMIS lists KMIs (currently android17-6.18) that
# testsuitekernels.zip already ships a "stock" kernel Image for, but which
# ghcr.io/ylarod/ddk-min has no DDK image for yet, so no "build" job exists
# for them in the matrix above; they are still boot-tested (bare, without
# any lkm4ctr.ko) purely as a forward-looking QEMU/kernel sanity check.
#
# Credit: SukiSU-Ultra (https://github.com/SukiSU-Ultra/SukiSU-Ultra).

name: Build and test lkm4ctr module

permissions:
  contents: read

on:
  push:
    branches: [lkm4ctr]
  pull_request:
    branches: [lkm4ctr]
  workflow_dispatch:
    inputs:
      kmis:
        description: 'Comma-separated DDK KMIs to build against (blank = full matrix)'
        required: false
        type: string
        default: ''
      create_release:
        description: 'Create a GitHub release with lkm4ctr.ko (all built KMIs) and lkm4ctr_checker'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Tag to use for the created release (blank = auto-generated)'
        required: false
        type: string
        default: ''

env:
  # KMIs published by SukiSU-Ultra's ghcr.io/ylarod/ddk-min image at this
  # DDK_RELEASE (see .../build-lkm.yml's matrix).
  DEFAULT_KMIS: >-
    android12-5.10,android13-5.10,android13-5.15,android14-5.15,android14-6.1,android15-6.6,android16-6.12
  DDK_RELEASE: '20260313'
  # KMIs boot-tested under QEMU below (see "Boot test (QEMU)" above) that
  # have no ghcr.io/ylarod/ddk-min DDK image yet, so they are not part of
  # the "build" matrix at all -- always appended to the "test" matrix
  # regardless of the "kmis" workflow_dispatch input.
  TEST_ONLY_KMIS: android17-6.18
  # testsuite.zip bundles a ready-to-use image1.ext4 (a full Android
  # system-as-root userland with toybox, bionic libc, static
  # docker/dockerd/containerd/runc preinstalled under /system/bin, and the
  # exported alpine tarball already baked in at its root) and a prebuilt
  # static arm64 busybox binary for the injected QEMU test ramdisk's
  # /busybox, in one archive.
  TESTSUITE_URL: https://github.com/cyanmint/GKI_KernelSU_SUSFS/releases/download/v2.2.0/testsuite.zip
  # testsuitekernels.zip bundles the per-KMI QEMU test kernels themselves
  # (Image.<short-kmi>.stock / Image.<short-kmi>.patched).
  TESTSUITE_KERNELS_URL: https://github.com/cyanmint/GKI_KernelSU_SUSFS/releases/download/v2.2.0/testsuitekernels.zip

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      test_matrix: ${{ steps.set-matrix.outputs.test_matrix }}
      ddk_release: ${{ steps.set-matrix.outputs.ddk_release }}
    steps:
      - name: Compute KMI matrix
        id: set-matrix
        run: |
          kmis="${{ github.event.inputs.kmis }}"
          if [ -z "$kmis" ]; then
            kmis="$DEFAULT_KMIS"
          fi
          json=$(python3 -c "
          import json, sys
          kmis = [k.strip() for k in sys.argv[1].split(',') if k.strip()]
          print(json.dumps(kmis))
          " "$kmis")
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          # The "test" matrix is the "build" matrix above plus
          # $TEST_ONLY_KMIS (KMIs with no DDK image/build job yet, boot-
          # tested bare -- see "Boot test (QEMU)" above), deduplicated.
          test_json=$(python3 -c "
          import json, sys
          build_kmis = [k.strip() for k in sys.argv[1].split(',') if k.strip()]
          test_only_kmis = [k.strip() for k in sys.argv[2].split(',') if k.strip()]
          seen = []
          for k in build_kmis + test_only_kmis:
              if k not in seen:
                  seen.append(k)
          print(json.dumps(seen))
          " "$kmis" "$TEST_ONLY_KMIS")
          echo "test_matrix=$test_json" >> "$GITHUB_OUTPUT"
          # Expose DDK_RELEASE as a job output: the "env" context is not
          # available in job-level "if:" conditions or in
          # "jobs.<job_id>.container", so downstream jobs cannot reference
          # env.DDK_RELEASE directly there.
          echo "ddk_release=$DDK_RELEASE" >> "$GITHUB_OUTPUT"

  # lkm4ctr_checker is a plain userspace diagnostic binary (see
  # lkm4ctr_checker/README.md): it has no kernel-module build dependency
  # at all (no DDK image, no KDIR, no Module.symvers), so it is built once
  # for arm64 with a standard cross toolchain, completely independent of the
  # per-KMI kernel-module "build" job below -- neither job needs/depends on
  # the other, and the .ko artifact produced by "build" no longer bundles
  # this checker binary at all.
  #
  build-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build lkm4ctr_checker (arm64, static)
        run: |
          make -C lkm4ctr_checker \
            CC=aarch64-linux-gnu-gcc
          file lkm4ctr_checker/lkm4ctr_checker

      - name: Upload lkm4ctr_checker (arm64)
        uses: actions/upload-artifact@v7
        with:
          name: lkm4ctr_checker-arm64
          path: lkm4ctr_checker/lkm4ctr_checker

  vendor-ns-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Shallow checkout Android14 6.1 kernel source
        run: |
          git clone https://android.googlesource.com/kernel/common \
            -b deprecated/android14-6.1-2025-02 \
            --depth=1 \
            "$RUNNER_TEMP/kernel-common"

      - name: Diff vendor_kernel against kernel-common
        run: |
          set -euo pipefail
          DIFF_OUT="$RUNNER_TEMP/vendor-ns.diff"
          sh vendor/vendor_kernel_diff.sh "$RUNNER_TEMP/kernel-common" | tee "$DIFF_OUT"
          {
            echo "## vendor_kernel vs kernel-common (android14-6.1)"
            echo
            echo '```diff'
            cat "$DIFF_OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi: ${{ fromJson(needs.prepare.outputs.matrix) }}
    # Run the whole job inside the DDK image (see
    # https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/run-jobs-in-a-container)
    # instead of a separate "docker pull" + "docker run -v ... bash -c '...'"
    # step pair: Actions pulls/starts the container once for the job and
    # runs every step's "run:" directly inside it (workspace already
    # bind-mounted at $GITHUB_WORKSPACE, no manual -v/-w/-e plumbing, and no
    # more root-owned modules-out/ requiring a chown afterwards, since the
    # checkout/build/upload steps all execute as the container's own user
    # throughout).
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ needs.prepare.outputs.ddk_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build lkm4ctr.ko (arm64, via DDK container)
        run: |
          set -euxo pipefail
          KDIR="/opt/ddk/kdir/${{ matrix.kmi }}"
          ROOT="$GITHUB_WORKSPACE/vendor"

          make -C "$KDIR" M="$ROOT" modules -j"$(nproc)"

          # collect the built .ko into a staging dir for upload.
          mkdir -p "$GITHUB_WORKSPACE/modules-out"
          cp "$ROOT/lkm4ctr.ko" "$GITHUB_WORKSPACE/modules-out/"

          echo "=== built modules ==="
          printf "%s\n" "$ROOT/lkm4ctr.ko"
          echo "=== staged modules ==="
          ls -la "$GITHUB_WORKSPACE/modules-out"

      # --- single artifact containing only lkm4ctr.ko for this KMI ---
      # (no longer bundles lkm4ctr_checker -- see build-checker above)
      - name: Upload lkm4ctr.ko for ${{ matrix.kmi }}
        uses: actions/upload-artifact@v7
        with:
          name: lkm4ctr-modules-${{ matrix.kmi }}-arm64
          path: modules-out/

  # Build a single injected (busybox) ramdisk carrying lkm4ctr.ko (if this
  # KMI was actually built), lkm4ctr_checker and the merged init script,
  # then boot-test every kernel Image available for this KMI in
  # testsuitekernels.zip under QEMU against it plus the prebuilt
  # image1.ext4 from testsuite.zip -- all in one job per KMI, since
  # assembling this ramdisk no longer needs its own separate session (no
  # more building image1.ext4, exporting an alpine tarball, or assembling a
  # second ext4 image).
  #
  # Runs as its own matrix over needs.prepare.outputs.test_matrix (the KMI
  # build matrix plus $TEST_ONLY_KMIS), independently of the full "build"
  # matrix's overall pass/fail -- an individual KMI's lkm4ctr.ko download
  # is allowed to fail (continue-on-error) so a KMI excluded from the build
  # matrix (e.g. via a custom `kmis` workflow_dispatch input, or one of
  # $TEST_ONLY_KMIS) still gets boot-tested bare (see "Boot test (QEMU)"
  # above), it just skips the insmod.
  test:
    needs: [prepare, build, build-checker]
    if: ${{ !cancelled() && needs.build-checker.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi: ${{ fromJson(needs.prepare.outputs.test_matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio qemu-system-arm

      - name: Compute short KMI name
        run: |
          # testsuitekernels.zip shortens the "android" KMI prefix to "a"
          # (e.g. android14-6.1 -> a14-6.1).
          echo "SHORT_KMI=a${KMI#android}" >> "$GITHUB_ENV"
        env:
          KMI: ${{ matrix.kmi }}

      # Allowed to fail: $TEST_ONLY_KMIS (and any KMI dropped from a custom
      # `kmis` workflow_dispatch input) have no "build" job/artifact at all.
      - name: Download lkm4ctr.ko (${{ matrix.kmi }})
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: lkm4ctr-modules-${{ matrix.kmi }}-arm64
          path: payload/

      - name: Download lkm4ctr_checker (arm64)
        uses: actions/download-artifact@v8
        with:
          name: lkm4ctr_checker-arm64
          path: payload/
      - run: chmod +x payload/lkm4ctr_checker

      # --- 1. Fetch testsuite.zip: prebuilt image1.ext4 + prebuilt busybox
      #        (arm64, static) -- no longer bundles any kernels ---
      - name: Download and extract testsuite.zip
        run: |
          set -e
          curl -fL -o testsuite.zip "$TESTSUITE_URL"
          mkdir -p testsuite
          unzip -o testsuite.zip image1.ext4 busybox -d testsuite
          chmod +x testsuite/busybox
          ls -la testsuite

      # --- 2. Fetch testsuitekernels.zip: extract only this KMI's kernel
      #        Image(s) ("stock", and "patched" where bundled) ---
      - name: Download and extract test kernels for ${{ matrix.kmi }}
        run: |
          set -e
          curl -fL -o testsuitekernels.zip "$TESTSUITE_KERNELS_URL"
          mkdir -p testkernels
          unzip -o testsuitekernels.zip "Image.${SHORT_KMI}.*" -d testkernels
          ls -la testkernels

      # --- 3. injected ramdisk: lkm4ctr.ko (if built for this KMI) +
      #        lkm4ctr_checker, /busybox (prebuilt, from testsuite.zip) and
      #        the merged qemu_test.sh (init mode), which mounts
      #        image1.ext4 (/dev/nvme0n1) and switch_root's into it ---
      - name: Build injected (busybox) ramdisk
        run: |
          set -e
          mkdir injected-ramdisk/
          cp testsuite/busybox injected-ramdisk/busybox
          chmod 755 injected-ramdisk/busybox

          cp payload/lkm4ctr_checker injected-ramdisk/
          chmod 755 injected-ramdisk/lkm4ctr_checker

          if [ -f payload/lkm4ctr.ko ]; then
            cp payload/lkm4ctr.ko injected-ramdisk/
          else
            echo "no lkm4ctr.ko built for ${{ matrix.kmi }} -- booting bare (boot/dockerd sanity only)"
          fi

          # Merged host-launcher/stage-1/stage-2 script: committed at
          # qemu_test.sh for better management (rather than generated
          # inline here). Its own shebang (#!/busybox sh) is what the
          # kernel execs here, dispatching on PID/argv[0]: run as /init
          # with PID 1 it performs stage 1 (mdev-populate /dev, mount
          # image1.ext4, copy lkm4ctr_checker/lkm4ctr.ko and /busybox onto
          # it, switch_root); copied onto the new root and run as
          # /second_init it performs stage 2 instead. (Host invocations of
          # this same file, i.e. `bash qemu_test.sh ...` below, take its
          # third mode instead -- see the script's own header comment.)
          cp qemu_test.sh injected-ramdisk/init
          chmod 755 injected-ramdisk/init

          (cd injected-ramdisk && find . | cpio -o -H newc > "$GITHUB_WORKSPACE/injected-ramdisk.cpio")
          ls -la injected-ramdisk.cpio

      # A generous per-kernel timeout: starting dockerd + docker import + a
      # real `docker run` takes noticeably longer than a plain
      # insmod+checker smoke test.
      - name: Boot ${{ matrix.kmi }} kernels under QEMU
        run: |
          # GitHub Actions runs step "run:" blocks with `bash -e`, so a
          # nonzero exit from qemu_test.sh (e.g. a kernel panic/timeout)
          # would otherwise abort this loop before the remaining kernels
          # are booted; "set +e" keeps every available kernel running
          # regardless of any individual failure.
          set +e
          # qemu_test.sh's shebang is #!/busybox sh (needed for its
          # ramdisk-init roles above), so it must be invoked explicitly as
          # "bash qemu_test.sh ..." here rather than "./qemu_test.sh ...",
          # which would honor that shebang instead.
          for kernel in testkernels/Image."$SHORT_KMI".*; do
            [ -e "$kernel" ] || continue
            bash qemu_test.sh testsuite/image1.ext4 "$kernel" /init injected-ramdisk.cpio
          done

      - name: Upload injected-ramdisk.cpio (${{ matrix.kmi }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: injected-ramdisk-${{ matrix.kmi }}
          path: injected-ramdisk.cpio

  # Only runs for a manual workflow_dispatch run with the "create_release"
  # input checked on. Collects lkm4ctr.ko for every KMI built in the "build"
  # matrix job plus the lkm4ctr_checker binary and publishes them all as
  # assets on a single GitHub release.
  release:
    needs: [prepare, build, build-checker]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all lkm4ctr.ko artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: lkm4ctr-modules-*-arm64
          path: release-assets

      - name: Download lkm4ctr_checker (arm64)
        uses: actions/download-artifact@v8
        with:
          name: lkm4ctr_checker-arm64
          path: release-assets/lkm4ctr_checker-arm64

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release-out
          for d in release-assets/lkm4ctr-modules-*-arm64/; do
            name="$(basename "$d")"
            kmi="${name#lkm4ctr-modules-}"
            kmi="${kmi%-arm64}"
            cp "$d/lkm4ctr.ko" "release-out/lkm4ctr-${kmi}-arm64.ko"
          done
          cp release-assets/lkm4ctr_checker-arm64/lkm4ctr_checker release-out/lkm4ctr_checker-arm64
          chmod +x release-out/lkm4ctr_checker-arm64
          echo "=== release assets ==="
          ls -la release-out

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            tag="lkm4ctr-$(date -u +%Y%m%d%H%M%S)"
          fi
          gh release create "$tag" release-out/* \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "Automated lkm4ctr build (KMIs: ${{ needs.prepare.outputs.matrix }})"
