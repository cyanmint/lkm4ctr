# Build the merged lkm4ctr out-of-tree module across a KMI matrix, then
# boot-test every KMI under QEMU against its prebuilt stock/patched kernels.
#
# lkm4ctr is a single combined lkm4ctr.ko built from sources under
# vendor/ (see README.md). This workflow
# builds that module, for every KMI in the matrix, inside SukiSU-Ultra's
# prebuilt "DDK" (Driver Development Kit) container image
# (ghcr.io/ylarod/ddk-min:<kmi>-<release>, see
# https://github.com/SukiSU-Ultra/SukiSU-Ultra/blob/main/.github/workflows/ddk-lkm.yml
# and .../build-lkm.yml for the KMI list). Each image ships a genuine
# vmlinux + Module.symvers + matching clang toolchain for that KMI (arm64
# only -- the real GKI device target), instead of a bare
# `git clone kernel/common` + `gki_defconfig` + `modules_prepare` tree, which
# only has stub/empty symbol CRC data and previously caused several
# hard-to-diagnose build failures:
#   - android12-5.10: arch/arm64/kernel/asm-offsets.c (via kvm_host.h ->
#     kgdb.h) failed to compile with every clang version available on a
#     plain Ubuntu runner ("value out of range for constraint 'I'"), because
#     no matching prebuilt toolchain was used.
#   - android15-6.6 / android16-6.12: modpost hard-errored on unresolved
#     core kernel symbols (no real Module.symvers), and android16-6.12's
#     gendwarfksyms needed libdw-dev, which wasn't installed.
# Building against the DDK's real vmlinux/Module.symvers/toolchain avoids
# all of the above.
#
# Module built (per KMI):
#   lkm4ctr                -- merged module containing the shared
#                                shadow_hijack hook engine plus
#                                vendor_kernel.
# The resulting .ko for a given KMI is uploaded on its own
# (lkm4ctr-modules-<kmi>-arm64); it no longer bundles the userspace
# checker binary (see below).
# A separate KernelSU module ZIP is assembled from all built KMI artifacts
# and includes the action script, boot service, multilingual WebUI and every
# matching lkm4ctr-<kmi>-arm64.ko file.
#
# lkm4ctr_checker is a plain userspace diagnostic *binary*, not a kernel
# module: it performs real syscalls to observe whether isolation actually
# works, rather than reporting compile-time Kconfig facts, so it is not tied
# to any particular KMI/kernel build at all -- it is cross-compiled once for
# arm64 using a standard aarch64 gcc cross toolchain (no DDK image, no kernel
# headers) and uploaded as its own artifact (lkm4ctr_checker-arm64). The
# "build" (.ko) and "build-checker" jobs are fully independent of each other
# (neither `needs:` the other) since they share no build inputs or outputs;
# only the "test" job below (which needs both) recombines them.
#
# Boot test (QEMU)
# -----------------
# testsuite.zip bundles a ready-to-use image1.ext4 directly (a full Android
# system-as-root userland with toybox, a real bionic libc, static
# docker/dockerd/containerd/runc under /system/bin, and the exported alpine
# tarball already baked in at its root) plus a prebuilt static arm64
# /busybox binary, so this workflow no longer builds either at all -- both
# are downloaded and used completely verbatim, for every KMI.
#
# Every KMI is booted using Google's official, unmodified GKI `Image` artifact
# downloaded from its pinned release build on ci.android.com. No third-party
# kernel archive or locally/CI-built test kernel is used.
#
# The "test" job runs as its own matrix, one job per KMI in
# needs.prepare.outputs.test_matrix. Each job downloads that KMI's remotely
# built lkm4ctr.ko plus the KMI-independent checker, testsuite.zip, and one
# official Google stock GKI Image. It builds one injected busybox ramdisk:
#   - /init is qemu_test.sh (#!/busybox sh), which dispatches on PID/argv[0].
#     Stage 1 (PID 1, argv[0] == "init") populates /dev via mdev, mounts
#     image1.ext4 (/dev/nvme0n1) at /newroot, copies the checker, module, and
#     busybox onto it, then switch_root's into the testsuite rootfs.
#   - Stage 2 repopulates /dev, runs the checker, insmods the matching module,
#     runs the checker again, starts dockerd, and executes the bundled Alpine
#     and Ubuntu container tests. When enabled, it then unmounts test mounts
#     and verifies rmmod on that same module instance immediately before poweroff.
#   - After the KMI matrix succeeds, a separate android14-6.1 run downloads
#     the prebuilt Redroid rootfs Disk A from release 4.0.1 and boots it with
#     an empty writable Disk B for test logs. The test injects that KMI's
#     module/checker into the initramfs, which copies them onto Disk A before
#     switch_root. Android's init service runs the tests after boot completion,
#     logs to Disk B, unmounts it, and shuts down.
#   - .github/workflows/build-redroid-disk-a.yml builds Disk A independently
#     and uploads it to the existing 4.0.1 release.
#
# Every KMI uses only its official, unmodified Google GKI Image; this workflow
# does not download kernel images from testsuitekernels.zip or build test
# kernels locally or in CI.
#
# Credit: SukiSU-Ultra (https://github.com/SukiSU-Ultra/SukiSU-Ultra).

name: Build and test lkm4ctr module

permissions:
  contents: read

on:
  push:
    branches: [lkm4ctr]
  pull_request:
    branches: [lkm4ctr]
  workflow_dispatch:
    inputs:
      kmis:
        description: 'Comma-separated DDK KMIs to build against (blank = full matrix; KernelSU ZIP/release requires the full matrix)'
        required: false
        type: string
        default: ''
      create_release:
        description: 'Create a GitHub release with lkm4ctr.ko, lkm4ctr_checker, and the KernelSU module ZIP'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag/version (must match kernelsu/module.prop; blank uses the module version)'
        required: false
        type: string
        default: ''
      release_note_url:
        description: 'HTTPS URL for the Markdown release notes (required when creating a release)'
        required: false
        type: string
        default: ''
env:
  # KMIs published by SukiSU-Ultra's ghcr.io/ylarod/ddk-min image at this
  # DDK_RELEASE (see .../build-lkm.yml's matrix).
  DEFAULT_KMIS: >-
    android12-5.10,android13-5.10,android13-5.15,android14-5.15,android14-6.1,android15-6.6,android16-6.12,android17-6.18
  DDK_RELEASE: '20260828'
  # Reserved for future KMIs without a DDK image; currently all target KMIs
  # are included in DEFAULT_KMIS and get a remote module build.
  TEST_ONLY_KMIS: ''
  # testsuite.zip bundles a ready-to-use image1.ext4 (a full Android
  # system-as-root userland with toybox, bionic libc, static
  # docker/dockerd/containerd/runc preinstalled under /system/bin, and the
  # exported alpine tarball already baked in at its root) and a prebuilt
  # static arm64 busybox binary for the injected QEMU test ramdisk's
  # /busybox, in one archive.
  TESTSUITE_URL: https://github.com/cyanmint/GKI_KernelSU_SUSFS/releases/download/v2.2.0/testsuite.zip

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      is_full_matrix: ${{ steps.set-matrix.outputs.is_full_matrix }}
      test_matrix: ${{ steps.set-matrix.outputs.test_matrix }}
      ddk_release: ${{ steps.set-matrix.outputs.ddk_release }}
    steps:
      - name: Compute KMI matrix
        id: set-matrix
        run: |
          kmis="$REQUESTED_KMIS"
          if [ -z "$kmis" ]; then
            kmis="$DEFAULT_KMIS"
          fi
          json=$(python3 -c "
          import json, sys
          kmis = [k.strip() for k in sys.argv[1].split(',') if k.strip()]
          supported = [k.strip() for k in sys.argv[2].split(',') if k.strip()]
          if not kmis:
              raise SystemExit('KMI list must not be empty')
          if len(kmis) != len(set(kmis)):
              raise SystemExit('KMI list contains duplicates')
          unknown = sorted(set(kmis) - set(supported))
          if unknown:
              raise SystemExit('Unsupported KMI(s): ' + ', '.join(unknown))
          print(json.dumps(kmis))
          " "$kmis" "$DEFAULT_KMIS")
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          is_full_matrix=$(python3 -c 'import json,sys; requested=json.loads(sys.argv[1]); supported=[k.strip() for k in sys.argv[2].split(",") if k.strip()]; print("true" if len(requested)==len(supported) and set(requested)==set(supported) else "false")' "$json" "$DEFAULT_KMIS")
          echo "is_full_matrix=$is_full_matrix" >> "$GITHUB_OUTPUT"
          # The "test" matrix is the "build" matrix above plus
          # $TEST_ONLY_KMIS (KMIs with no DDK image/build job yet, booted
          # without a module artifact), deduplicated.
          test_json=$(python3 -c "
          import json, sys
          build_kmis = [k.strip() for k in sys.argv[1].split(',') if k.strip()]
          test_only_kmis = [k.strip() for k in sys.argv[2].split(',') if k.strip()]
          seen = []
          for k in build_kmis + test_only_kmis:
              if k not in seen:
                  seen.append(k)
          print(json.dumps(seen))
          " "$kmis" "$TEST_ONLY_KMIS")
          echo "test_matrix=$test_json" >> "$GITHUB_OUTPUT"

          # Expose DDK_RELEASE as a job output: the "env" context is not
          # available in job-level "if:" conditions or in
          # "jobs.<job_id>.container", so downstream jobs cannot reference
          # env.DDK_RELEASE directly there.
          echo "ddk_release=$DDK_RELEASE" >> "$GITHUB_OUTPUT"
        env:
          REQUESTED_KMIS: ${{ github.event.inputs.kmis }}

  # lkm4ctr_checker is a plain userspace diagnostic binary (see
  # lkm4ctr_checker/README.md): it has no kernel-module build dependency
  # at all (no DDK image, no KDIR, no Module.symvers), so it is built once
  # for arm64 with a standard cross toolchain, completely independent of the
  # per-KMI kernel-module "build" job below -- neither job needs/depends on
  # the other, and the .ko artifact produced by "build" no longer bundles
  # this checker binary at all.
  #
  build-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build lkm4ctr_checker (arm64, static)
        run: |
          make -C lkm4ctr_checker \
            CC=aarch64-linux-gnu-gcc
          file lkm4ctr_checker/lkm4ctr_checker

      - name: Upload lkm4ctr_checker (arm64)
        uses: actions/upload-artifact@v7
        with:
          name: lkm4ctr_checker-arm64
          path: lkm4ctr_checker/lkm4ctr_checker

  vendor-ns-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Shallow checkout Android14 6.1 kernel source
        run: |
          git clone https://android.googlesource.com/kernel/common \
            -b deprecated/android14-6.1-2025-02 \
            --depth=1 \
            "$RUNNER_TEMP/kernel-common"

      - name: Diff vendor_kernel against kernel-common
        if: cancelled()
        run: |
          set -euo pipefail
          DIFF_OUT="$RUNNER_TEMP/vendor-ns.diff"
          sh vendor/vendor_kernel_diff.sh "$RUNNER_TEMP/kernel-common" | tee "$DIFF_OUT"
          {
            echo "## vendor_kernel vs kernel-common (android14-6.1)"
            echo
            echo '```diff'
            cat "$DIFF_OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi: ${{ fromJson(needs.prepare.outputs.matrix) }}
    # Run the whole job inside the DDK image (see
    # https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/run-jobs-in-a-container)
    # instead of a separate "docker pull" + "docker run -v ... bash -c '...'"
    # step pair: Actions pulls/starts the container once for the job and
    # runs every step's "run:" directly inside it (workspace already
    # bind-mounted at $GITHUB_WORKSPACE, no manual -v/-w/-e plumbing, and no
    # more root-owned modules-out/ requiring a chown afterwards, since the
    # checkout/build/upload steps all execute as the container's own user
    # throughout).
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ needs.prepare.outputs.ddk_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build lkm4ctr.ko (arm64, via DDK container)
        env:
          KMI: ${{ matrix.kmi }}
        run: |
          set -euxo pipefail
          KDIR="/opt/ddk/kdir/$KMI"
          ROOT="$GITHUB_WORKSPACE/vendor"

          # Mirror module lifecycle/exit-hook diagnostics to QEMU's serial log.
          make -C "$KDIR" M="$ROOT" LKM4CTR_LOG_DMESG=y modules -j"$(nproc)"

          # collect the built .ko into a staging dir for upload.
          mkdir -p "$GITHUB_WORKSPACE/modules-out"
          cp "$ROOT/lkm4ctr.ko" "$GITHUB_WORKSPACE/modules-out/"

          echo "=== built modules ==="
          printf "%s\n" "$ROOT/lkm4ctr.ko"
          echo "=== staged modules ==="
          ls -la "$GITHUB_WORKSPACE/modules-out"

      # --- single artifact containing only lkm4ctr.ko for this KMI ---
      # (no longer bundles lkm4ctr_checker -- see build-checker above)
      - name: Upload lkm4ctr.ko for ${{ matrix.kmi }}
        uses: actions/upload-artifact@v7
        with:
          name: lkm4ctr-modules-${{ matrix.kmi }}-arm64
          path: modules-out/


  build-kernelsu-module:
    needs: [prepare, build, build-checker]
    if: ${{ needs.prepare.outputs.is_full_matrix == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all per-KMI lkm4ctr modules
        uses: actions/download-artifact@v8
        with:
          pattern: lkm4ctr-modules-*-arm64
          path: kernelsu-module-input

      - name: Download lkm4ctr_checker
        uses: actions/download-artifact@v8
        with:
          name: lkm4ctr_checker-arm64
          path: kernelsu-checker-input

      - name: Validate module controls and build KernelSU ZIP
        run: |
          set -euo pipefail
          sh -n kernelsu/control.sh kernelsu/action.sh kernelsu/service.sh kernelsu/customize.sh
          python3 -m unittest discover -s kernelsu/tests -v
          python3 kernelsu/build_module.py \
            kernelsu-module-input \
            kernelsu-checker-input/lkm4ctr_checker \
            "$KMI_MATRIX_JSON" \
            "$RUNNER_TEMP/lkm4ctr-kernelsu-module.zip"
          unzip -l "$RUNNER_TEMP/lkm4ctr-kernelsu-module.zip"
        env:
          KMI_MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}

      - name: Upload KernelSU module ZIP
        uses: actions/upload-artifact@v7
        with:
          name: lkm4ctr-kernelsu-module
          path: ${{ runner.temp }}/lkm4ctr-kernelsu-module.zip


  # Build one injected (busybox) ramdisk with the KMI's remotely built module
  # when available, the checker, and the merged init script; boot the official
  # Google GKI Image against the prebuilt image1.ext4 from testsuite.zip.
  #
  # Runs as its own matrix over needs.prepare.outputs.test_matrix (the KMI
  # build matrix plus $TEST_ONLY_KMIS). Every default KMI has a remote module
  # build; reserved test-only KMIs still boot the same official image without
  # a module.
  test:
    needs: [prepare, build, build-checker]
    if: ${{ !cancelled() && needs.build-checker.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi: ${{ fromJson(needs.prepare.outputs.test_matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio qemu-system-arm

      - name: Compute short KMI name
        run: |
          # Use a short prefix for the downloaded Google GKI Image filename
          # (e.g. android14-6.1 -> a14-6.1).
          echo "SHORT_KMI=a${KMI#android}" >> "$GITHUB_ENV"
        env:
          KMI: ${{ matrix.kmi }}

      # Allowed to fail: $TEST_ONLY_KMIS (and any KMI dropped from a custom
      # `kmis` workflow_dispatch input) have no "build" job/artifact at all.
      - name: Download lkm4ctr.ko (${{ matrix.kmi }})
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: lkm4ctr-modules-${{ matrix.kmi }}-arm64
          path: payload/

      - name: Require module artifact for built KMI (${{ matrix.kmi }})
        if: ${{ contains(fromJson(needs.prepare.outputs.matrix), matrix.kmi) }}
        run: test -s payload/lkm4ctr.ko

      - name: Download lkm4ctr_checker (arm64)
        uses: actions/download-artifact@v8
        with:
          name: lkm4ctr_checker-arm64
          path: payload/
      - run: chmod +x payload/lkm4ctr_checker

      # --- 1. Fetch testsuite.zip: prebuilt image1.ext4 + prebuilt busybox
      #        (arm64, static) -- no longer bundles any kernels ---
      - name: Download and extract testsuite.zip
        run: |
          set -e
          curl -fL -o testsuite.zip "$TESTSUITE_URL"
          mkdir -p testsuite
          unzip -o testsuite.zip image1.ext4 busybox -d testsuite
          chmod +x testsuite/busybox
          ls -la testsuite

      - name: Download official Google GKI Image for ${{ matrix.kmi }}
        env:
          KMI: ${{ matrix.kmi }}
        run: |
          set -euo pipefail
          case "$KMI" in
            android12-5.10) BID=16466982; EXPECTED_BRANCH=aosp_kernel-common-android12-5.10-2025-09 ;; # android12-5.10-2025-09_r7
            android13-5.10) BID=16466983; EXPECTED_BRANCH=aosp_kernel-common-android13-5.10-2026-07 ;; # android13-5.10-2026-07_r3
            android13-5.15) BID=16466997; EXPECTED_BRANCH=aosp_kernel-common-android13-5.15-2025-07 ;; # android13-5.15-2025-07_r9
            android14-5.15) BID=16498032; EXPECTED_BRANCH=aosp_kernel-common-android14-5.15-2026-10 ;; # android14-5.15-2026-10_r1
            android14-6.1) BID=16466993; EXPECTED_BRANCH=aosp_kernel-common-android14-6.1-2025-09 ;; # android14-6.1-2025-09_r35
            android15-6.6) BID=16467007; EXPECTED_BRANCH=aosp_kernel-common-android15-6.6-2025-09 ;; # android15-6.6-2025-09_r22
            android16-6.12) BID=16541025; EXPECTED_BRANCH=aosp_kernel-common-android16-6.12-2026-09 ;; # android16-6.12-2026-09_r4
            android17-6.18) BID=16554389; EXPECTED_BRANCH=aosp_kernel-common-android17-6.18-2026-09 ;; # android17-6.18-2026-09_r7
            *) echo "No official GKI build ID configured for $KMI" >&2; exit 2 ;;
          esac
          BASE="https://ci.android.com/builds/submitted/$BID/kernel_aarch64/latest/raw"
          mkdir -p testkernels
          curl -fsSL --retry 3 --retry-delay 2 "$BASE/BUILD_INFO" -o "$RUNNER_TEMP/gki-build-info.json"
          python3 - "$RUNNER_TEMP/gki-build-info.json" "$EXPECTED_BRANCH" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              info = json.load(f)
          expected_branch = sys.argv[2]
          target = info.get("target", {})
          if info.get("branch") != expected_branch:
              raise SystemExit(f"wrong GKI branch: {info.get('branch')!r}, expected {expected_branch!r}")
          if target.get("name") != "kernel_aarch64" or target.get("target_status") != 1:
              raise SystemExit(f"official kernel target is not successful: {target.get('name')!r}, status={target.get('target_status')!r}")
          if "Image" not in target.get("dir_list", []):
              raise SystemExit("official GKI build has no raw Image artifact")
          PY
          IMAGE="testkernels/Image.${SHORT_KMI}.official"
          curl -fL --retry 3 --retry-delay 2 "$BASE/Image" -o "$IMAGE.part"
          test -s "$IMAGE.part"
          file "$IMAGE.part"
          mv "$IMAGE.part" "$IMAGE"
          ls -lh "$IMAGE"

      # --- 2. injected ramdisk: lkm4ctr.ko (built remotely for this KMI) +
      #        lkm4ctr_checker, /busybox (prebuilt, from testsuite.zip) and
      #        the merged qemu_test.sh (init mode), which mounts
      #        image1.ext4 (/dev/nvme0n1) and switch_root's into it. The host
      #        launcher enables module testing for this official stock image. ---
      - name: Build injected (busybox) ramdisk
        env:
          KMI: ${{ matrix.kmi }}
        run: |
          set -e
          mkdir injected-ramdisk/
          cp testsuite/busybox injected-ramdisk/busybox
          chmod 755 injected-ramdisk/busybox
          cp payload/lkm4ctr_checker injected-ramdisk/
          chmod 755 injected-ramdisk/lkm4ctr_checker

          if [ -f payload/lkm4ctr.ko ]; then
            cp payload/lkm4ctr.ko injected-ramdisk/
          else
            echo "no lkm4ctr.ko built for $KMI -- boot/checker baseline only"
          fi

          # Merged host-launcher/stage-1/stage-2 script: committed at
          # qemu_test.sh for better management (rather than generated
          # inline here). Its own shebang (#!/busybox sh) is what the
          # kernel execs here, dispatching on PID/argv[0]: run as /init
          # with PID 1 it performs stage 1 (mdev-populate /dev, mount
          # image1.ext4, copy lkm4ctr_checker/lkm4ctr.ko and /busybox onto
          # it, switch_root); copied onto the new root and run as
          # /second_init it performs stage 2 instead. (Host invocations of
          # this same file, i.e. `bash qemu_test.sh ...` below, take its
          # third mode instead -- see the script's own header comment.)
          cp qemu_test.sh injected-ramdisk/init
          chmod 755 injected-ramdisk/init

          (cd injected-ramdisk && find . | cpio -o -H newc > "$GITHUB_WORKSPACE/injected-ramdisk.cpio")
          ls -la injected-ramdisk.cpio

      # The official Google GKI Image exercises the module and
      # Docker/containerd path for every KMI.
      - name: Boot ${{ matrix.kmi }} kernels under QEMU
        env:
          KMI: ${{ matrix.kmi }}
        run: |
          set +e
          set -o pipefail
          failures=0
          kernel_count=0
          for kernel in testkernels/Image."$SHORT_KMI".*; do
            [ -e "$kernel" ] || continue
            kernel_count=$((kernel_count + 1))
            name="${kernel##*/}"
            log="qemu-${name}.log"
            echo "--- $name ---"
            # qemu_test.sh's shebang is #!/busybox sh (needed for its
            # ramdisk-init roles), so invoke the host-launcher mode via bash.
            module_test=0
            if [ -f payload/lkm4ctr.ko ]; then
              module_test=1
            else
              echo "No matching module artifact for $name; running checker-only boot test"
            fi
            rmmod_test=0
            if [ "$module_test" -eq 1 ]; then
              rmmod_test=1
            fi
            proc_ns_fallback_test=0
            # android12-5.10 is the designated fallback KMI. The guest checks
            # that at least one namespace path is absent and its matching
            # native unshare probe fails before insmod; other KMIs still
            # validate both paths and classify native support before load.
            if [ "$module_test" -eq 1 ] && [ "$KMI" = "android12-5.10" ]; then
              proc_ns_fallback_test=1
            fi
            LKM4CTR_TEST_MODULE="$module_test" LKM4CTR_TEST_RMMOD="$rmmod_test" \
              LKM4CTR_TEST_REQUIRE_PROC_NS_FALLBACK="$proc_ns_fallback_test" \
              bash qemu_test.sh testsuite/image1.ext4 "$kernel" /init injected-ramdisk.cpio 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            echo "launcher_rc=$rc"
            if grep -Eq 'Kernel panic|Oops:|BUG:|list_add corruption|list_del corruption|CFI failure|Unknown symbol|RMMOD_TEST_FAILED|PROC_NS_ACCESS_FAIL|PROC_NS_SELF_LINK_FAIL|PROC_NS_SELF_READLINK_FAIL|PROC_NS_PID_LINK_FAIL|PROC_NS_PID_READLINK_FAIL|PROC_NS_FALLBACK_REQUIRED_FAILED|lkm4ctr\.ko failed to load|insmod: failed' "$log"; then
              echo "KERNEL_ERROR: $name (see $log)"
              failures=$((failures + 1))
            elif [ "$proc_ns_fallback_test" -eq 1 ] && ! grep -Fq 'PROC_NS_FALLBACK_REQUIRED_PASS' "$log"; then
              echo "INCOMPLETE: $name did not verify the required IPC/PID procfs fallback"
              failures=$((failures + 1))
            elif [ "$module_test" -eq 1 ] && ! grep -Fq '=== LKM4CTR_QEMU_TEST: post-use rmmod after module and container tests succeeded ===' "$log"; then
              echo "INCOMPLETE: $name did not unload the used module before shutdown (see $log)"
              failures=$((failures + 1))
            elif [ "$module_test" -eq 1 ] && ! grep -Fq '=== LKM4CTR_QEMU_TEST: FULL MODULE + CONTAINER TESTS DONE ===' "$log"; then
              echo "INCOMPLETE: $name did not complete the module and container-runtime tests"
              failures=$((failures + 1))
            elif ! grep -q '=== LKM4CTR_QEMU_TEST: DONE ===' "$log"; then
              echo "INCOMPLETE: $name did not reach the full-test completion marker (see $log)"
              failures=$((failures + 1))
            else
              echo "COMPLETED: $name (full log: $log)"
            fi
          done
          if [ "$kernel_count" -eq 0 ]; then
            echo "No kernel images found for $KMI"
            exit 1
          fi
          if [ "$failures" -ne 0 ]; then
            echo "$failures QEMU kernel test(s) failed"
            exit 1
          fi

      - name: Upload injected-ramdisk.cpio (${{ matrix.kmi }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: injected-ramdisk-${{ matrix.kmi }}
          path: injected-ramdisk.cpio

      - name: Upload QEMU logs (${{ matrix.kmi }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-logs-${{ matrix.kmi }}
          path: qemu-Image.*.log

  # Runs only after every ordinary KMI QEMU test completes successfully.
  # Disk A is a prebuilt Redroid rootfs downloaded from the 4.0.1 release;
  # the matching module/checker are injected into this QEMU initramfs and
  # copied onto Disk A after mount, before switch_root.
  redroid-test:
    needs: [prepare, test, build]
    if: ${{ !cancelled() && contains(fromJson(needs.prepare.outputs.matrix), 'android14-6.1') && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Redroid QEMU test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio e2fsprogs qemu-system-arm zstd

      - name: Download prebuilt Redroid Disk A from release 4.0.1
        run: |
          mkdir -p redroid
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/cyanmint/lkm4ctr/releases/download/4.0.1/redroid-test-disk-a.ext4.zst \
            -o redroid/redroid-test-disk-a.ext4.zst

      - name: Download android14-6.1 lkm4ctr.ko
        uses: actions/download-artifact@v8
        with:
          name: lkm4ctr-modules-android14-6.1-arm64
          path: payload/

      - name: Download lkm4ctr_checker (arm64)
        uses: actions/download-artifact@v8
        with:
          name: lkm4ctr_checker-arm64
          path: payload/

      - name: Download testsuite busybox
        run: |
          curl -fL --retry 3 -o testsuite.zip "$TESTSUITE_URL"
          unzip -o testsuite.zip busybox -d testsuite
          chmod 755 testsuite/busybox

      - name: Download official android14-6.1 GKI Image
        run: |
          set -euo pipefail
          base=https://ci.android.com/builds/submitted/16466993/kernel_aarch64/latest/raw
          curl -fsSL --retry 3 --retry-delay 2 "$base/BUILD_INFO" -o "$RUNNER_TEMP/gki-build-info.json"
          python3 - "$RUNNER_TEMP/gki-build-info.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              info = json.load(f)
          target = info.get("target", {})
          if info.get("branch") != "aosp_kernel-common-android14-6.1-2025-09":
              raise SystemExit(f"unexpected GKI branch: {info.get('branch')!r}")
          if target.get("name") != "kernel_aarch64" or target.get("target_status") != 1:
              raise SystemExit("official android14-6.1 GKI build is not successful")
          if "Image" not in target.get("dir_list", []):
              raise SystemExit("official GKI build has no raw Image artifact")
          PY
          curl -fL --retry 3 --retry-delay 2 "$base/Image" -o redroid/Image.android14-6.1.official
          test -s redroid/Image.android14-6.1.official

      - name: Create empty writable Disk B
        run: |
          truncate -s 512M redroid-test-disk-b.ext4
          mkfs.ext4 -F -m 0 -L LKM4CTR_LOGS redroid-test-disk-b.ext4

      - name: Boot Redroid and run lkm4ctr tests on android14-6.1
        run: |
          set -euo pipefail
          zstd -d --force redroid/redroid-test-disk-a.ext4.zst \
            -o redroid-test-disk-a.ext4
          mkdir -p redroid-output
          bash tests/redroid/run-qemu.sh \
            redroid/Image.android14-6.1.official \
            redroid-test-disk-a.ext4 \
            redroid-test-disk-b.ext4 \
            testsuite/busybox \
            redroid-output \
            payload/lkm4ctr.ko \
            payload/lkm4ctr_checker

      - name: Upload Redroid test results from Disk B
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redroid-test-disk-b-android14-6.1
          path: |
            redroid-test-disk-b.ext4
            redroid-output/
          if-no-files-found: warn
          compression-level: 0

  # Only runs for a manual workflow_dispatch run with the "create_release"
  # input checked on. Publishes the per-KMI modules, checker and combined
  # KernelSU module ZIP as assets on one GitHub release.
  release:
    needs: [prepare, build, build-checker, build-kernelsu-module]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release && needs.build-kernelsu-module.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all lkm4ctr.ko artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: lkm4ctr-modules-*-arm64
          path: release-assets

      - name: Download lkm4ctr_checker (arm64)
        uses: actions/download-artifact@v8
        with:
          name: lkm4ctr_checker-arm64
          path: release-assets/lkm4ctr_checker-arm64

      - name: Download KernelSU module ZIP
        uses: actions/download-artifact@v8
        with:
          name: lkm4ctr-kernelsu-module
          path: release-assets/kernelsu-module

      - name: Assemble release assets
        run: |
          set -euo pipefail
          module_version="$(python3 -c 'from pathlib import Path; print(next((line.split("=", 1)[1].strip() for line in Path("kernelsu/module.prop").read_text(encoding="utf-8").splitlines() if line.startswith("version=")), ""))')"
          if [ -z "$module_version" ]; then
            echo "module.prop has no version" >&2
            exit 1
          fi
          mkdir -p release-out
          for d in release-assets/lkm4ctr-modules-*-arm64/; do
            name="$(basename "$d")"
            kmi="${name#lkm4ctr-modules-}"
            kmi="${kmi%-arm64}"
            cp "$d/lkm4ctr.ko" "release-out/lkm4ctr-${module_version}-${kmi}-arm64.ko"
          done
          cp release-assets/lkm4ctr_checker-arm64/lkm4ctr_checker \
            "release-out/lkm4ctr_checker-${module_version}-arm64"
          chmod +x "release-out/lkm4ctr_checker-${module_version}-arm64"
          cp release-assets/kernelsu-module/lkm4ctr-kernelsu-module.zip release-out/lkm4ctr-kernelsu-module.zip
          echo "=== release assets ==="
          ls -la release-out

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NOTE_URL: ${{ inputs.release_note_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          module_version="$(python3 -c 'from pathlib import Path; print(next((line.split("=", 1)[1].strip() for line in Path("kernelsu/module.prop").read_text(encoding="utf-8").splitlines() if line.startswith("version=")), ""))')"
          if [ -z "$module_version" ]; then
            echo "module.prop has no version" >&2
            exit 1
          fi
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="$module_version"
          fi
          if [ "$tag" != "$module_version" ]; then
            echo "Release tag $tag must match module.prop version $module_version" >&2
            exit 1
          fi
          python3 kernelsu/build_update_json.py kernelsu/module.prop "$tag" release-out/update.json
          python3 -m json.tool release-out/update.json
          if [ -z "$RELEASE_NOTE_URL" ]; then
            echo "release_note_url is required when create_release is enabled" >&2
            exit 1
          fi
          case "$RELEASE_NOTE_URL" in
            https://*) ;;
            *) echo "release_note_url must use HTTPS" >&2; exit 1 ;;
          esac
          notes_file="$RUNNER_TEMP/release-notes.md"
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 --max-filesize 65536 \
            --output "$notes_file" "$RELEASE_NOTE_URL"
          if [ ! -s "$notes_file" ]; then
            echo "Downloaded release notes are empty" >&2
            exit 1
          fi
          gh release create "$tag" release-out/* \
            --repo "$REPOSITORY" \
            --title "$tag" \
            --notes-file "$notes_file"
